name: Keep-alive API

# Mantiene despierta la API de ChembaTv en Render (plan free: se apaga a los
# 15 min sin trafico). Los repos publicos tienen minutos de Actions ilimitados.

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Despertar la API
        run: |
          set -u
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "https://api-chembatv.giize.com/api/v2/health") || code="000"
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "La API no respondio"; exit 1; }

  keep-active:
    if: github.event.schedule == '0 4 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Registrar actividad mensual
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-activity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-activity
          git diff --staged --quiet || git commit -m "chore: actividad mensual"
          git push